<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>control-tower</title>
<style>
:root { --bg: #f6f6f4; --col: #ebebe7; --card: #fff; --fg: #1d1d1b; --mute: #6b6b66; --line: #d6d6d0;
        --mine: #c2410c; --busy: #2563eb; --perm: #a16207; color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --col: #1f1f1d; --card: #2a2a27; --fg: #ececea; --mute: #9a9a94; --line: #3a3a36;
            --mine: #fb923c; --busy: #60a5fa; --perm: #facc15; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
.bar { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bar strong { font-size: 15px; color: var(--mine); }
.bar span, .interval { color: var(--mute); }
.interval { position: fixed; top: 12px; right: 16px; }
.cols { display: flex; gap: 12px; padding: 12px 16px; overflow-x: auto; align-items: flex-start; }
.col { flex: 0 0 340px; background: var(--col); border-radius: 8px; padding: 8px; }
.col.teams { flex-basis: 460px; }
.col header { display: flex; gap: 8px; align-items: baseline; padding: 2px 4px 8px; }
.col h2 { margin: 0; font-size: 14px; }
.meta { color: var(--mute); font-size: 12px; }
.card { display: block; width: 100%; text-align: left; font: inherit; color: inherit;
        background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
        border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
button.card { cursor: pointer; } button.card:hover { border-color: var(--mute); }
.card.mine { border-left-color: var(--mine); } .card.busy { border-left-color: var(--busy); }
.card.perm { border-left-color: var(--perm); } .card.dead { opacity: .45; }
.head { display: flex; gap: 8px; align-items: baseline; }
.name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mine-n { color: var(--mine); font-weight: 600; font-size: 12px; }
.sub { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .status { display: flex; gap: 6px; align-items: center; font-weight: 600; margin-top: 2px; }
.card.mine .status { color: var(--mine); } .card.busy .status { color: var(--busy); } .card.perm .status { color: var(--perm); }
.card.mine .status .dot { background: var(--mine); } .card.busy .status .dot { background: var(--busy); }
.card.perm .status .dot { background: var(--perm); } .card.idle .status .dot { background: transparent; border: 1px solid var(--mute); }
.ask { color: var(--mute); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask::before { content: '▸ '; }
.summary { margin: 6px 0 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.reason { font-weight: 600; }
.who { color: var(--mute); font-size: 11px; margin-right: 6px; }
.summary.empty { color: var(--mute); }
.msg { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 5px; align-items: center; font: inherit; font-size: 12px; color: inherit; cursor: pointer;
        background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 7px; max-width: 100%; }
.chip:hover { border-color: var(--mute); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.chip .t, .chip .agent { color: var(--mute); }
.chip .agent { font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.chip.mine { border-color: var(--mine); font-weight: 600; } .chip.mine .dot { background: var(--mine); }
.chip.busy .dot { background: var(--busy); }
.chip.perm { border-color: var(--perm); font-weight: 600; } .chip.perm .dot { background: var(--perm); }
.chip.idle .dot { background: transparent; border: 1px solid var(--mute); }
.chip.dead { opacity: .45; text-decoration: line-through; }
.legend { display: flex; gap: 12px; color: var(--mute); font-size: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
#toast { position: fixed; bottom: 16px; right: 16px; background: #b91c1c; color: #fff; padding: 8px 12px;
         border-radius: 6px; display: none; }
</style>
</head>
<body>
<div class="interval">every __INTERVAL_MS__ ms</div>
<main><!--BOARD--></main>
<div id="toast"></div>
<script>
(() => {
    const TOKEN = '__TOKEN__';
    const INTERVAL = __INTERVAL_MS__;
    const main = document.querySelector('main');
    const toast = document.getElementById('toast');
    let last = main.innerHTML;
    let hoverUntil = 0;

    const setTitle = () => {
        const n = main.querySelector('[data-my-turn]')?.dataset.myTurn || '0';
        document.title = `(${n}) control-tower`;
    };
    const showToast = (text) => {
        toast.textContent = text;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    };

    // Don't swap the DOM under the pointer (max 10s), so a click lands on the label the user aimed at.
    main.addEventListener('mouseover', (e) => { if (e.target.closest('[data-h]') && !hoverUntil) hoverUntil = Date.now() + 10000; });
    main.addEventListener('mouseout', (e) => { if (!e.relatedTarget?.closest?.('[data-h]')) hoverUntil = 0; });

    main.addEventListener('click', async (e) => {
        const chip = e.target.closest('[data-h]');
        if (!chip) return;
        try {
            const res = await fetch(`/switch?h=${encodeURIComponent(chip.dataset.h)}&k=${encodeURIComponent(TOKEN)}`);
            const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.ok) showToast(`switch failed: ${body.error || res.status}`);
        } catch (err) {
            showToast(`switch failed: ${err.message}`);
        }
    });

    setInterval(async () => {
        if (hoverUntil && Date.now() < hoverUntil) return;
        try {
            const r = await fetch('/fragment');
            if (!r.ok) return;
            const html = await r.text();
            if (html !== last) { main.innerHTML = html; last = html; setTitle(); }
        } catch { /* server restarting; next tick retries */ }
    }, INTERVAL);
    setTitle();
})();
</script>
</body>
</html>
